[build-system]
requires = ["setuptools", "setuptools-scm>8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-integrated-channels"
description = "An integrated channel is an abstraction meant to represent a third-party system which provides an API that can be used to transmit EdX data to the third-party system."
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [
    {name = "Open edX Project", email = "oscm@openedx.org"},
]
classifiers = [
    'Development Status :: 3 - Alpha',
    'Framework :: Django',
    'Framework :: Django :: 4.2',
    'Framework :: Django :: 5.2',
    'Intended Audience :: Developers',
    'Natural Language :: English',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
]
keywords = [
    "Python",
    "edx",
]
readme = "README.rst"

dynamic = ["version"]

dependencies = [
    "Django>=4.2",
    "openedx-atlas",
    "pytz",
    "requests",
    "edx-opaque-keys[django]",
    "celery",
    "edx_django_utils",
    "jsonfield",
    "django-model-utils",
    "django-simple-history",
    "django-config-models",
    "django-fernet-fields-v2",
    "edx-drf-extensions",
    "edx-rest-api-client",
    "django-oauth-toolkit",
    "django-object-actions",
    "unicodecsv",
    "slumber",
    "edx-rbac",
    "edx-tincan-py35",
    # Normally we don't pin anything here, but this flexible constraint helps ensure the version of
    # enterprise-integrated-channels deployed has actually been tested with this major version of
    # snowflake-connector-python.
    "snowflake-connector-python>=4.0.0,<5.0.0",
]

[project.urls]
Homepage = "https://github.com/openedx/enterprise-integrated-channels"
Repository = "https://github.com/openedx/enterprise-integrated-channels"

[dependency-groups]
test-base = [
    "code-annotations",
    "ddt<1.4.0",
    "diff-cover",
    "factory_boy",
    "freezegun",
    "mock",
    "openedx-events",
    "pytest-cov",
    "pytest-django",
    "responses",
    "social-auth-app-django",
    "testfixtures",
    "django-countries",
]
test = [
    {include-group = "test-base"},
]
test-django42 = [
    {include-group = "test-base"},
    "Django>=4.0,<5.0",
]
test-django52 = [
    {include-group = "test-base"},
    "Django>=5.0,<6.0",
]
quality = [
    {include-group = "test"},
    "edx-lint",
    "isort",
    "pycodestyle",
    "pydocstyle",
]
doc = [
    {include-group = "test"},
    "doc8",
    "sphinx-book-theme",
    "twine",
    "build",
    "Sphinx",
]
ci = [
    "tox",
    "tox-uv",
]
dev = [
    {include-group = "quality"},
    {include-group = "ci"},
    "edx-i18n-tools",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["channel_integrations*"]
exclude = ["*tests*"]

[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"
fallback_version = "0.0.0.dev0"

[tool.semantic_release]
# Existing release tags are bare version numbers (e.g. "0.1.62"), not the
# "v{version}" python-semantic-release defaults to. Without this, semantic-release
# wouldn't recognize any prior release and would restart versioning from scratch.
tag_format = "{version}"
build_command = "pip install build && SETUPTOOLS_SCM_PRETEND_VERSION=$NEW_VERSION python -m build"
# This repo is still on a 0.x version. major_on_zero defaults to True, which
# would auto-bump straight to 1.0.0 on the first breaking-change commit --
# but 1.0.0 is supposed to signal a deliberate "first stable release", not an
# accidental side effect of a conventional-commit marker. Keep bumps within
# 0.x (0.x.y -> 0.(x+1).0) until a 1.0.0 release is a deliberate decision.
major_on_zero = false
allow_zero_version = true

[tool.uv]
package = true
# Every `uv sync`/`uv run` invocation in this repo names an explicit --group.
# Without this, uv's implicit default group (named "dev") would be synced *in
# addition* to whatever --group is passed, silently pulling the entire
# dev/test/quality/ci superset into every target, defeating the point of
# having separate groups.
default-groups = []
#  DO NOT EDIT constraint-dependencies DIRECTLY.
#  This list is managed by `edx_lint write_uv_constraints`
#  and will be overwritten the next time `make upgrade` is run.
#  - GLOBAL constraints: edit edx_lint/files/common_constraints.txt
#  - REPO-SPECIFIC constraints: edit [tool.edx_lint].uv_constraints in this file
constraint-dependencies = [
    "Django<6.0",
    "elasticsearch<7.14.0",
    "social-auth-app-django<5.5",
]
conflicts = [
    [
        {group = "test-django42"},
        {group = "test-django52"},
    ],
]

[tool.edx_lint]
uv_constraints = [
    "social-auth-app-django<5.5",
]

[tool.isort]
indent = '    '
line_length = 120
multi_line_output = 3
include_trailing_comma = true
skip = ["migrations"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "test_settings"
addopts = "--cov channel_integrations --cov-report term-missing --cov-report xml"
norecursedirs = [".*", "docs", "requirements", "site-packages"]

[tool.coverage.run]
branch = true
source_pkgs = ["channel_integrations"]
omit = [
    "test_settings.py",
    "*/migrations/*",
    "*admin.py",
    "*/static/*",
    "*/templates/*",
    # TODO: ENT-10733: Remove this exclusion and add proper test coverage for API v1 module
    "channel_integrations/api/v1/*",
]
